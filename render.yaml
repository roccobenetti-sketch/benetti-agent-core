services:
  - type: web
    name: benetti-agent-core
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: AGENT_PIN
        value: "2026"
      - key: GEMINI_MODEL
        value: "Gemini-3.5-Flash-Lite"
      - key: GEMINI_KEY
        sync: false
